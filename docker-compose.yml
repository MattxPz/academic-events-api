services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: postgres-dev-events
    environment:
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ups123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_events:/var/lib/postgresql/data

  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev-events
    ports:
      - "6379:6379"

volumes:
  pgdata_events: